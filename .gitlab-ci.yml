stages:
  - test

default:
  tags:
    - k8s
    - amd64

variables:
  GITHUB_ORG: qoretechnologies
  REPO_NAME: module-amqp

.platform-test:
  stage: test
  script:
    - python3 test/docker_test/platform-ci.py

test-ubuntu:
  extends: .platform-test
  image: $CI_REGISTRY/infrastructure/qore-test-base/qore-test-base:develop

test-alpine:
  extends: .platform-test
  image: $CI_REGISTRY/infrastructure/qore-test-base/qore-test-base:develop-alpine
